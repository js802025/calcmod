//    maven { url = 'https://oss.sonatype.org/content/repositories/snapshots' }
//    maven { url = 'https://oss.sonatype.org/content/repositories/central' }

    mavenCentral()
}

dependencies {
    compileOnly "io.papermc.paper:paper-api:${project.minecraft_version}.build.63-stable"
    compileOnly 'com.github.spotbugs:spotbugs-annotations:4.9.3'
    implementation 'io.papermc:paperlib:1.0.8'
    testCompileOnly 'com.github.spotbugs:spotbugs-annotations:4.9.3'
 //   testImplementation "io.papermc.paper:paper-api:${project.minecraft_version}-R0.1-SNAPSHOT"
    testImplementation 'org.junit.jupiter:junit-jupiter:5.13.1'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.13.0'
    implementation 'org.mariuszgromada.math:MathParser.org-mXparser:5.0.6'
//    compileOnly 'org.spigotmc:spigot-api:1.20.2-R0.1-SNAPSHOT'
}

test {
    useJUnitPlatform()
}

processResources {
    filesMatching("**/plugin.yml") {
        expand ( NAME: rootProject.name, VERSION: version, PACKAGE: rootProject.group.toString() )
    }
}

